<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f5f7">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://product-workbench-sync.island-writer.workers.dev; base-uri 'none'; form-action 'self'">
  <meta name="data-mode" content="cloud"><meta name="data-api-url" content="https://product-workbench-sync.island-writer.workers.dev"><meta name="robots" content="noindex,nofollow">
  <title>产品数据工作台</title>
  <link rel="icon" href="./favicon.svg?v=15"><link rel="stylesheet" href="./styles.css?v=15"><link rel="stylesheet" href="./theme.css?v=15">
  <script type="module" src="./app.js?v=15"></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#overview"><img src="./favicon.svg?v=15" width="39" height="39" alt=""><span>产品数据工作台<small>PRODUCT INTELLIGENCE</small></span></a>
    <div class="nav-caption">工作空间</div>
    <nav aria-label="主导航">
      <button data-page="overview" class="nav-item active"><span data-icon="grid"></span>数据概览</button>
      <button data-page="rooms" class="nav-item"><span data-icon="layers"></span>直播间看板</button>
      <button data-page="products" class="nav-item"><span data-icon="box"></span>产品表现</button>
      <button data-page="stock" class="nav-item"><span data-icon="calculator"></span>备货计算<span class="nav-dot"></span></button>
      <button data-page="prices" class="nav-item"><span data-icon="money"></span>价格查询</button>
      <button data-page="quality" class="nav-item"><span data-icon="database"></span>数据与口径</button>
    </nav>
    <button id="theme-toggle" class="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="白底模式"><span class="theme-switch"><i></i></span><span>白底模式</span></button>
  </aside>
  <div class="workspace">
    <header class="topbar"><div class="breadcrumb">工作空间 <span>/</span> <strong id="breadcrumb">数据概览</strong></div><div class="top-actions"><a class="source-link" id="source-link" href="#" target="_blank" rel="noreferrer">查看原始表格 <span data-icon="external"></span></a><span class="top-divider"></span><span class="local-status"><i></i> 企业微信数据</span></div></header>
    <main id="main">
      <div class="page-heading"><div><div class="eyebrow">PRODUCT INSIGHTS</div><h1 id="page-title">产品数据概览<span class="heading-dot">.</span></h1><p id="page-subtitle">从产品表现到直播间转化，把每一场销售看清楚。</p></div><div class="heading-actions"><button id="show-history" class="button outline"><span data-icon="orders"></span>历史回看</button><button id="show-report" class="button report-button"><span data-icon="download"></span>生成报告</button><button id="refresh" class="button primary"><span data-icon="refresh"></span><span>读取原表并发布</span></button><a id="source-refresh-link" class="button primary" href="http://localhost:4318/?from=share#overview" target="_blank" rel="noopener noreferrer" hidden><span data-icon="refresh"></span><span>读取原表并发布</span></a></div></div>
      <div id="sync-bar" class="sync-bar" role="status" aria-live="polite"><span class="sync-icon"></span><span id="sync-message">正在加载数据…</span><span id="sync-time"></span></div>
      <div id="source-update-help" class="source-update-help" hidden><div><button id="source-refresh-toggle" type="button" role="switch" aria-checked="false" aria-describedby="source-refresh-hint"><span class="source-refresh-switch" aria-hidden="true"><i></i></span><span>重新读取企业微信原表</span></button><p id="source-refresh-hint">关闭时，只获取上次成功发布的数据。</p></div><div class="source-update-actions"><button id="snapshot-refresh" type="button" hidden>获取已发布数据</button><button id="source-update" type="button">更新说明 <span data-icon="info"></span></button></div></div>
      <nav id="business-tabs" class="business-tabs" aria-label="业务切换"></nav>
      <section id="global-filters" class="filters" aria-label="筛选条件">
        <label><span>数据范围</span><select id="filter-group"><option value="">全部业务</option></select></label>
        <label><span>直播间</span><select id="filter-room"><option value="">全部直播间</option></select></label>
        <label><span>主播</span><select id="filter-anchor"><option value="">全部主播</option></select></label>
        <div class="date-filter" role="group" aria-label="直播日期"><span class="date-filter-label">直播日期</span><div class="date-inputs"><label class="date-input-wrap"><span>开始日期</span><input id="filter-from" type="date" aria-label="开始日期"></label><span class="date-separator" aria-hidden="true">至</span><label class="date-input-wrap"><span>结束日期</span><input id="filter-to" type="date" aria-label="结束日期"></label></div></div>
        <button class="button quiet" id="reset-filters">重置</button>
      </section>
      <div id="range-tools" class="range-tools"><span id="range-label">全部历史</span><div><button data-range="all" class="active">全部历史</button><button data-range="latest">最近售卖日</button><button data-range="7">近 7 天</button><button data-range="30">近 30 天</button></div></div>
      <section id="overview-view" class="page-view"><div class="loading-card"><span class="loader"></span>正在读取产品数据</div></section>
      <section id="rooms-view" class="page-view" hidden></section>
      <section id="products-view" class="page-view" hidden></section>
      <section id="stock-view" class="page-view" hidden></section>
      <section id="prices-view" class="page-view" hidden></section>
      <section id="quality-view" class="page-view" hidden></section>
      <footer>产品数据工作台 <span>组合按一单统计，备货按组件拆分</span></footer>
    </main>
  </div>
  <dialog id="product-dialog"><div id="dialog-content"></div></dialog>
  <dialog id="tool-dialog"><div id="tool-content"></div></dialog>
  <dialog id="price-dialog"></dialog>
  <div id="toast" role="status"></div>
</body>
</html>
